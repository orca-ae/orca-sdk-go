components:
  schemas:
    CloudExtensionApiResource:
      required:
      - kind
      - name
      - namespaced
      type: object
      properties:
        name:
          type: string
        namespaced:
          type: boolean
        kind:
          type: string
    CloudExtensionApiResourceList:
      required:
      - group_version
      - kind
      - resources
      type: object
      properties:
        kind:
          type: string
          enum:
          - APIResourceList
        group_version:
          type: string
        resources:
          type: array
          items:
            $ref: "#/components/schemas/CloudExtensionApiResource"
    AgentProviderInfo:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        api_url:
          type: string
        api_version:
          type: string
        beta_version:
          type: string
        api_key_env:
          type: string
        api_key_configured:
          type: boolean
    ConfigFieldDefinition:
      type: object
      properties:
        fieldName:
          type: string
        typeName:
          type: string
        attributes:
          type: object
          additionalProperties:
            type: string
    ConnectorDefinition:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        sourceClass:
          type: string
        sinkClass:
          type: string
        sourceConfigClass:
          type: string
        sinkConfigClass:
          type: string
    ConnectionConfig:
      type: object
      properties:
        name:
          type: string
        spec:
          $ref: "#/components/schemas/V1alpha1ConnectionSpec"
        status:
          $ref: "#/components/schemas/V1alpha1ConnectionStatus"
        internal:
          type: boolean
        clusterRef:
          type: string
    V1alpha1ConnectionSpec:
      type: object
      properties:
        kafka:
          $ref: "#/components/schemas/V1alpha1ConnectionSpecKafka"
        other:
          $ref: "#/components/schemas/V1alpha1ConnectionSpecOther"
        pulsar:
          $ref: "#/components/schemas/V1alpha1ConnectionSpecPulsar"
        type:
          type: string
          enum:
          - pulsar
          - kafka
          - other
    V1alpha1ConnectionSpecKafka:
      type: object
      properties:
        authentication:
          $ref: "#/components/schemas/V1alpha1ConnectionSpecKafkaAuthentication"
        bootstrapServers:
          type: string
        tls:
          $ref: "#/components/schemas/V1alpha1ConnectionSpecKafkaTls"
      nullable: true
    V1alpha1ConnectionSpecKafkaAuthentication:
      type: object
      properties:
