# Orca Agent Engine extension APIs.
#
# Extracted from the generated Managed Agents HTTP contract. Keep these paths
# aligned with the backend while retaining the core-only contract separately.
openapi: 3.0.2
info:
  title: Orca Agent Engine Extensions API
  version: 0.0.0
paths:
  /apis/policy.runorca.ai/v1:
    get:
      summary: Resources served by the policy.runorca.ai/v1 group.
      tags:
        - discovery
        - orca-extension
      parameters:
        - name: anthropic-beta
          in: header
          schema:
            type: string
            description: Accepted for Anthropic SDK compatibility and ignored. No value of this header changes request handling. Typed as a free-form string rather than an enum because this service recognises no specific beta value.
      operationId: discovery.policyGroupResources
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind:
                    type: string
                    enum:
                      - APIResourceList
                  group_version:
                    type: string
                  resources:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Lowercase plural path segment, e.g. `guardrails`.
                        namespaced:
                          type: boolean
                          description: Whether instances belong to a workspace.
                        kind:
                          type: string
                          description: Singular PascalCase type name, e.g. `Guardrail`.
                      required:
                        - name
                        - namespaced
                        - kind
                required:
                  - kind
                  - group_version
                  - resources
