x-deployment-trigger-schema-extension:
  session_modes: [SESSION_PER_EVENT, SESSION_PER_TOPIC, SESSION_PER_KEY, SHARED]
  cron_session_modes: [SESSION_PER_EVENT, SHARED]
  source_types: [cron, kafka, pulsar]
  source_properties:
    connection:
      type: string
      minLength: 1
    topics:
      type: array
      minItems: 1
      items:
        type: string
        minLength: 1
    topic_pattern:
      type: string
      minLength: 1
    subscription_name:
      type: string
    type_class_name:
      type: string
    type_class_definition:
      type: string
    schema_type:
      type: string
    consumer_additional_config:
      type: object
      additionalProperties: true
    input_schema_configs:
      type: object
      additionalProperties:
        type: object
        properties:
          subject:
            type: string
            nullable: true
          type:
            type: string
            nullable: true
          version:
            type: integer
            nullable: true
  source_variants:
    cron:
      fields: [type, schedule, timezone, payload]
      required: [type, schedule, payload]
    kafka:
      fields: [type, connection, topics, topic_pattern, subscription_name, type_class_name,
               type_class_definition, schema_type, consumer_additional_config, input_schema_configs]
      required: [type, connection]
      topic_selector: true
    pulsar:
      fields: [type, connection, topics, topic_pattern, subscription_name, type_class_name,
               type_class_definition, schema_type]
      required: [type, connection]
      topic_selector: true
  minimum_replicas: 1
  expected_matches: 8
  targets_sha256: e5d0e8e8d771b23fc545dac3e380084c96527114582c7e21a199c12ca341d329
actions:
  - target: $.paths['/v1/git-creds'].post
    remove: true
    x-deployment-deviation: POST /v1/git-creds
  - target: $.paths['/v1/environments'].post.requestBody.content.application/json.schema.properties
    remove_properties: [packages, networking, image, target]
    x-deployment-deviation: POST /v1/environments
  - target: $.paths['/v1/environments/{id}'].post.requestBody.content.application/json.schema.properties
    remove_properties: [packages, networking, image, target]
    x-deployment-deviation: POST /v1/environments/{id}
  - target: $.paths['/v1/sessions'].get.parameters[?(@.name == 'agent_version' || @.name == 'created_at[gt]' || @.name == 'created_at[gte]' || @.name == 'created_at[lt]' || @.name == 'created_at[lte]' || @.name == 'deployment_id' || @.name == 'memory_store_id' || @.name == 'order' || @.name == 'statuses')]
    remove: true
    x-deployment-deviation: GET /v1/sessions
  - target: $.paths['/v1/agents'].get.parameters[?(@.name == 'created_at[gte]' || @.name == 'created_at[lte]')]
    remove: true
    x-deployment-deviation: GET /v1/agents
  - target: $.paths['/v1/files'].get.parameters[?(@.name == 'scope_id')]
    remove: true
    x-deployment-deviation: GET /v1/files
  - target: $.paths['/v1/memory_stores'].get.parameters[?(@.name == 'created_at[gte]' || @.name == 'created_at[lte]')]
    remove: true
    x-deployment-deviation: GET /v1/memory_stores
  - target: $.paths['/v1/memory_stores/{id}/memory_versions'].get.parameters[?(@.name == 'session_id')]
    remove: true
    x-deployment-deviation: GET /v1/memory_stores/{id}/memory_versions
  - target: $.paths['/v1/skills'].get.parameters[?(@.name == 'source')]
    remove: true
    x-deployment-deviation: GET /v1/skills
  - target: $.paths['/v1/triggers'].get.parameters[?(@.name == 'include_archived')]
    remove: true
    x-deployment-deviation: GET /v1/triggers
  - target: $.paths['/v1/triggers'].post.parameters[?(@.name == 'idempotency-key')]
    remove: true
    x-deployment-deviation: POST /v1/triggers
  - target: $.paths['/v1/triggers/{id}'].post.parameters[?(@.name == 'idempotency-key')]
    remove: true
    x-deployment-deviation: POST /v1/triggers/{id}
  - target: $.paths['/v1/triggers/{id}'].delete.parameters[?(@.name == 'idempotency-key')]
    remove: true
    x-deployment-deviation: DELETE /v1/triggers/{id}
  - target: $.paths['/v1/triggers/{id}/pause'].post.parameters[?(@.name == 'idempotency-key')]
    remove: true
    x-deployment-deviation: POST /v1/triggers/{id}/pause
  - target: $.paths['/v1/triggers/{id}/unpause'].post.parameters[?(@.name == 'idempotency-key')]
    remove: true
    x-deployment-deviation: POST /v1/triggers/{id}/unpause
  - target: $.paths['/v1/agents/{id}'].delete.responses
    remove: true
    x-deployment-deviation: DELETE /v1/agents/{id}
  - target: $.paths['/v1/agents/{id}'].delete
    update:
      responses:
        '400':
          description: Agent deletion is not supported
    x-deployment-deviation: DELETE /v1/agents/{id}
