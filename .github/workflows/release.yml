name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare release
    runs-on: ubuntu-latest
    # A fork has no business tagging releases in its upstream's name, and the
    # push trigger would otherwise fire there too.
    if: github.repository == 'orca-ae/orca-sdk-go'
    steps:
      # Go modules are served straight from the tag by the module proxy, so
      # creating the tag is the entire publish step - there is no artifact to
      # build or upload.
      #
      # The token is not the default GITHUB_TOKEN: this repository disallows
      # Actions from opening pull requests, which is exactly what Release Please
      # has to do. Scoping the elevated token to this one workflow is narrower
      # than lifting that restriction for every workflow in the repository. It
      # also means the tag is created by a real account, so a tag-triggered
      # workflow added later actually fires - one created by GITHUB_TOKEN would
      # not.
      - name: Run Release Please
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.SNBOT_GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
