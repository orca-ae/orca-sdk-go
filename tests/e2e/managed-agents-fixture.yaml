apiVersion: apps/v1
kind: Deployment
metadata:
  name: orca-managed-agents-fixture
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: orca-managed-agents-fixture
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orca-managed-agents-fixture
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orca-managed-agents-fixture
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: fixture
          image: __FIXTURE_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: orca-managed-agents-fixture
  namespace: __NAMESPACE__
spec:
  selector:
    app.kubernetes.io/name: orca-managed-agents-fixture
  ports:
    - name: http
      port: 8080
      targetPort: http
